# Builds a signed Android APK and an unsigned iOS IPA when a version tag is pushed, and attaches
# them to a GitHub release for that tag. Secrets are listed in the README.
#
# The tag must match the version in pubspec.yaml: version 1.0.0+4 is tagged v1.0.0+4. A suffix
# (v1.0.0+5-beta, v1.0.0-beta+5) names the files and marks a pre-release; the app itself keeps
# the pubspec version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Match the tag to pubspec.yaml
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BASE=$(echo "$TAG" | sed -E 's/[-_][A-Za-z0-9.]+//')
          PUBSPEC=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$BASE" != "$PUBSPEC" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec version $PUBSPEC (expected v$PUBSPEC)"
            exit 1
          fi
          # 1.0.0+4 -> 1.0.0-build4 (a "+" is awkward in download URLs).
          echo "name=$(echo "$TAG" | sed -E 's/\+([0-9]+)/-build\1/')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Tests that need real bank statements skip themselves when test_statements/ is absent.
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Without android/key.properties a release build silently falls back to the debug key, so
      # stop here if any secret is missing.
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; exit 1; fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "PaisaFlow-${{ needs.check.outputs.name }}.apk"

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PaisaFlow-*.apk

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Unsigned: no paid Apple developer account. Sideloading tools (AltStore, Sideloadly) sign
      # it with the user's own Apple ID.
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "PaisaFlow-${{ needs.check.outputs.name }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: PaisaFlow-*.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=$([[ "${GITHUB_REF_NAME#v}" == *[-_]* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" PaisaFlow-* --repo "$GITHUB_REPOSITORY" \
            --title "Paisa Flow ${GITHUB_REF_NAME#v}" --generate-notes $PRERELEASE
